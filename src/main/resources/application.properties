spring.application.name=spring-security-user-details-service

#spring.security.user.name=admin12
#spring.security.user.password=your


# ADDING SECRET KEY AND EXPIRATION FOR JWT
jwt.secret=
jwt.expiration=
jwt.refresh.token.expiration=



spring.datasource.url=jdbc:mysql://localhost:3306/security_db
spring.datasource.username=root
spring.datasource.password=Qwerty@786
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# 2. JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto: update (development k liye), validate (production k liye)
spring.jpa.hibernate.ddl-auto=update

# SQL queries logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5



