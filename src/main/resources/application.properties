spring.application.name=spring-security-user-details-service

spring.security.user.name=your
spring.security.user.password=your

spring.datasource.url=url
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=drivername


# 2. JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto: update (development k liye), validate (production k liye)
spring.jpa.hibernate.ddl-auto=update

# SQL queries logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
